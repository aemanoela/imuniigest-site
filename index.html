<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Login - ImuniGest</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="login-page">



<div class="login-card">


<div class="login-header">


<div class="logo-area-login">


<img 
src="logo.png"
class="logo-login"
alt="Logo SIGVAC">


<div class="texto-logo">


<h1>
ImuniGest
</h1>


<p>
Sistema Integrado de Gestão de Vacinação
</p>


</div>


</div>


</div>




<div class="login-form">



<label>
CPF
</label>


<input 
type="text"
placeholder="Digite seu CPF">







<label>
Senha
</label>


<input 
type="password"
placeholder="Digite sua senha">



<label>
Tipo de Usuário
</label>



<select class="tipo-usuario">


<option selected disabled>

Selecione seu perfil

</option>



<option>

Administrador

</option>



<option>

Enfermeiro

</option>



<option>

Estoquista

</option>



</select>









<div class="login-options">



<label>

<input type="checkbox">

Lembrar-me

</label>





<a href="#">

Esqueceu a senha?

</a>



</div>








<a href="dashboard.html" class="btn-login">

Entrar

</a>





</div>




</div>




</body>


</html>
